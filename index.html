<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Штурман маршрута</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="card">
        <label for="routeName" class="label">Название маршрута</label>
        <input id="routeName" class="input" type="text" placeholder="Например: Поездка до дачи" />
      </header>

      <section class="card">
        <h2 class="section-title">Текущий этап</h2>
        <div id="currentStageCard" class="current-stage"></div>
      </section>

      <section class="card">
        <h2 class="section-title">Управление</h2>
        <div class="button-grid">
          <button id="nextBtn" class="btn btn-primary">Проехали</button>
          <button id="backBtn" class="btn">Назад</button>
          <button id="lostBtn" class="btn btn-warning">Потерялись</button>
          <button id="saveBtn" class="btn">Сохранить маршрут</button>
          <button id="loadBtn" class="btn">Загрузить маршрут</button>
          <button id="resetBtn" class="btn btn-danger">Сбросить</button>
        </div>

        <div id="lostPanel" class="lost-panel hidden">
          <label for="manualLocation" class="label">Где мы сейчас?</label>
          <textarea id="manualLocation" class="input" rows="3" placeholder="Опишите текущее место..." ></textarea>
          <button id="saveLocationBtn" class="btn btn-primary">Сохранить текущую позицию</button>
        </div>

        <div id="manualAnchorBlock" class="manual-anchor hidden"></div>
      </section>

      <section class="card">
        <h2 class="section-title">Этапы маршрута</h2>
        <ul id="stageList" class="stage-list"></ul>
        <button id="addStageBtn" class="btn btn-primary">Добавить этап</button>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
